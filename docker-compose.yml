# psiberAI — single frontend container today; FE/BE-ready.
# When the backend lands, uncomment `backend` + `proxy` below and the reverse
# proxy routes `/` → frontend and `/api` → backend. No frontend rewrite needed.

services:
  frontend:
    build:
      context: ./frontend
    image: ghcr.io/psiberai/website:latest
    container_name: psiberai-frontend
    restart: unless-stopped
    ports:
      - "80:80" # host:container — Cloudflare (or a future Caddy proxy) sits in front
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --- future backend (FastAPI / Node) ---------------------------------------
