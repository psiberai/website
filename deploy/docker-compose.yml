# Production compose (LIVE on the host) — Cloudflare Tunnel in front of the frontend.
#
# cloudflared dials OUT to Cloudflare, so there is no public origin port
# (the host's 80/443 stay CLOSED) and no origin IP/cert to manage. The token
# is the only secret, supplied via deploy/.env (gitignored):
#     CLOUDFLARE_TUNNEL_TOKEN=...
# In the Cloudflare tunnel, route the public hostnames to  http://frontend:80.
#
# Portability: run this file + .env (same token) on ANY host and traffic
# follows — no DNS, IP, or cert change. Move = `docker compose up -d` elsewhere.

services:
  frontend:
    image: ghcr.io/psiberai/website:latest
    container_name: psiberai-frontend
    restart: unless-stopped
    pull_policy: always
    expose:
      - "80" # internal only — cloudflared reaches it over the compose network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: psiberai-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in deploy/.env}
    depends_on:
      frontend:
        condition: service_healthy

  # --- future backend: same pattern — private image, NO public port ----------
  # backend:
  #   image: ghcr.io/psiberai/website-api:latest   # private package
  #   restart: unless-stopped
  #   expose: ["8000"]
  #   env_file: [/opt/psiberai/backend.env]        # secrets at runtime, not in the image
  #   # then add a tunnel public hostname: app.psiberai.com -> http://backend:8000
  #   # (no public IP needed — served outbound through the same tunnel)
