# =============================================================================
# CUTOVER compose — Cloudflare Tunnel in front of the frontend.
#
# Why this exists: it's the portable + secure edge. `cloudflared` makes an
# OUTBOUND connection to Cloudflare, so there is:
#   • no public origin port (80/443 can be CLOSED on the box)
#   • no origin IP for Cloudflare to point at (no A record)
#   • no origin TLS certificate to install
# Moving hosts = run this same file + the same token on the new box. Traffic
# follows automatically — nothing to change, not even an IP.
#
# The ONLY secret is the tunnel token, supplied via .env (gitignored):
#   CLOUDFLARE_TUNNEL_TOKEN=...   (Zero Trust → Networks → Tunnels → your tunnel)
# In the Cloudflare dashboard, route the public hostname (psiberai.com, www)
# to the service  http://frontend:80  (cloudflared reaches it over this network).
# =============================================================================

services:
  frontend:
    image: ghcr.io/psiberai/website:latest
    container_name: psiberai-frontend
    restart: unless-stopped
    pull_policy: always
    expose:
      - "80" # internal only — no host port; cloudflared reaches it over the compose network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: psiberai-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in deploy/.env}
    depends_on:
      frontend:
        condition: service_healthy

  # --- future backend: same pattern — private image, no host port -------------
  # backend:
  #   image: ghcr.io/psiberai/website-api:latest
  #   expose: ["8000"]
  #   env_file: [/opt/psiberai/backend.env]   # secrets at runtime
  #   # then add a second public-hostname route in Cloudflare: api.psiberai.com -> http://backend:8000
